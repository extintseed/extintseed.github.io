name: Publicar sitio web

on:
  push:
    branches: [main]
    paths:
      - extintseed-site.zip
      - .github/workflows/publicar-sitio.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6
      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          unzip -q extintseed-site.zip -d _site
          rm -rf _site/.git _site/.github
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
